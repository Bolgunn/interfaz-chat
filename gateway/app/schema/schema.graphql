"""
API Gateway del chat. Agrega en un solo esquema el chat base (users, channels,
messages) y las capacidades de integrals, threads y polls.
"""
type Query {
  "Vida del gateway; no prueba sus dependencias."
  health: String!
  "Estado de cada microservicio (llama a su /health)."
  services: [ServiceStatus!]!

  user(id: ID!): User
  channels: [Channel!]!
  channel(id: ID!): Channel
  messages(channelId: ID!): [Message!]!

  replies(channelId: ID!, messageId: ID!): [Reply!]!

  integrals(limit: Int = 20, offset: Int = 0, status: String): IntegralPage!
  integral(id: ID!): Integral

  poll(id: ID!): Poll
  "Encuestas anunciadas en el canal (Polls no tiene endpoint de listado)."
  polls(channelId: ID!): [Poll!]!
}

type Mutation {
  createUser(displayName: String!): User!
  createChannel(name: String!): Channel!
  sendMessage(channelId: ID!, authorId: ID!, content: String!): Message!

  createReply(channelId: ID!, messageId: ID!, authorId: ID!, content: String!): Reply!

  calculateIntegral(latex: String!): Integral!

  createPoll(input: CreatePollInput!): Poll!
  "Registra el voto y devuelve la encuesta con los conteos actualizados."
  votePoll(pollId: ID!, voterId: ID!, optionId: ID!): Poll!
  closePoll(pollId: ID!, authorId: ID!): Poll!
}

type ServiceStatus {
  name: String!
  up: Boolean!
  latencyMs: Int
}

type User {
  id: ID!
  displayName: String!
}

type Channel {
  id: ID!
  name: String!
}

type Message {
  id: ID!
  channelId: ID!
  authorId: ID!
  "null si users no responde o el autor no existe."
  author: User
  content: String!
  createdAt: String!
  "ID de la encuesta si el mensaje es un anuncio de Polls."
  pollId: ID
  "null si polls no responde."
  poll: Poll
  "null si threads no responde."
  replyCount: Int
}

type Reply {
  id: ID!
  channelId: ID!
  messageId: ID!
  authorId: ID!
  author: User
  content: String!
  createdAt: String!
}

type Integral {
  id: ID!
  latex: String!
  status: String!
  result: IntegralResult
  error: IntegralError
  source: IntegralSource!
  durationMs: Int!
  createdAt: String!
}

type IntegralResult {
  latex: String!
  numeric: Float
  indefinite: Boolean!
}

type IntegralError {
  code: String!
  message: String!
}

type IntegralSource {
  kind: String!
  channelId: ID
  authorId: ID
  messageId: ID
}

type IntegralPage {
  items: [Integral!]!
  total: Int!
  limit: Int!
  offset: Int!
}

type Poll {
  id: ID!
  channelId: ID!
  authorId: ID!
  author: User
  question: String!
  options: [PollOption!]!
  "open, closed, pending_announcement o creation_failed"
  status: String!
  durationMinutes: Int!
  closesAt: String!
  createdAt: String!
  closedAt: String
  totalVotes: Int!
}

type PollOption {
  id: ID!
  position: Int!
  text: String!
  voteCount: Int!
}

input CreatePollInput {
  channelId: ID!
  authorId: ID!
  question: String!
  options: [String!]!
  durationMinutes: Int = 5
}
