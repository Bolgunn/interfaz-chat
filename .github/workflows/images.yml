# Prueba el gateway y publica las imágenes del gateway y la interfaz en GHCR.
# Tags: `v1` (la que usa k8s/kustomization.yaml) y el SHA del commit.
name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r gateway/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: gateway

  publish:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [gateway, interface]
    steps:
      - uses: actions/checkout@v4
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/interfaz-chat-${{ matrix.component }}:v1
            ghcr.io/${{ steps.owner.outputs.name }}/interfaz-chat-${{ matrix.component }}:${{ github.sha }}
